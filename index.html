<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiPe – IT SERVICES, LDA | Brevemente</title>
    
    <!-- ÍCONE DA WIPE NO SEPARADOR DO NAVEGADOR (FAVICON) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff2a5f'/><text x='55%25' y='68%25' font-size='55' font-weight='800' font-family='sans-serif' fill='%23ffffff' text-anchor='middle'>W</text></svg>">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d0f14; color: #ffffff; display: flex; justify-content: center; align-items: center; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .content { position: relative; z-index: 2; text-align: center; padding: 2rem; max-width: 600px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .logo-container { position: relative; margin-bottom: 2.5rem; padding-right: 40px; }
        .logo-main { font-size: 5rem; font-weight: 800; color: #ffffff; letter-spacing: -3px; line-height: 0.9; position: relative; z-index: 2; }
        .logo-sub { font-size: 1.6rem; font-weight: 700; color: #ffffff; letter-spacing: 1px; margin-top: 5px; text-align: left; position: relative; z-index: 2; }
        .magenta-sphere { position: absolute; width: 120px; height: 120px; background-color: #ff2a5f; border-radius: 50%; top: -20px; right: 10px; z-index: 1; }

        .slogan-block { border-top: 1px solid rgba(255, 255, 255, 0.3); padding-top: 0.8rem; margin-top: 1rem; text-transform: uppercase; letter-spacing: 2px; line-height: 1.4; }
        .slogan-block div { font-size: 0.75rem; font-weight: 600; color: #cbd5e1; }

        .status-msg { margin-top: 3.5rem; font-size: 1.4rem; font-weight: 600; color: #ffffff; letter-spacing: 0.5px; animation: pulse 2s infinite ease-in-out; background: rgba(13, 15, 20, 0.7); padding: 0.8rem 2rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px); }

        footer { position: absolute; bottom: 1.5rem; z-index: 2; font-size: 0.8rem; color: #64748b; letter-spacing: 0.5px; text-align: center; width: 100%; }

        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @media (max-width: 480px) { .logo-main { font-size: 3.8rem; } .logo-sub { font-size: 1.2rem; } .magenta-sphere { width: 90px; height: 90px; top: -15px; right: 20px; } .status-msg { font-size: 1.1rem; } }
    </style>
</head>
<body>

    <canvas id="serverRoom"></canvas>

    <div class="content">
        <div class="logo-container">
            <div class="logo-main">WiPe</div>
            <div class="logo-sub">IT SERVICES, LDA</div>
            <div class="magenta-sphere"></div>
        </div>

        <div class="slogan-block">
            <div>Tecnologia Simplificada</div>
            <div>Sucesso Maximizado</div>
        </div>

        <div class="status-msg">Em desenvolvimento abre em breve.</div>
    </div>

    <footer>
        &copy; 2026 WiPe – IT SERVICES, LDA. Todos os direitos reservados.
    </footer>

    <script>
        const canvas = document.getElementById('serverRoom');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const totalRacks = 6;
        const serverRows = 10;
        const racks = [];

        for (let i = 0; i < totalRacks; i++) {
            racks.push({
                side: i % 2 === 0 ? 'left' : 'right',
                depth: Math.floor(i / 2) * 0.35 + 0.15,
                lights: Array(serverRows).fill(0).map(() => Math.random() > 0.4)
            });
        }

        function drawServerRoom() {
            ctx.clearRect(0, 0, width, height);

            const bgGrad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
            bgGrad.addColorStop(0, '#111622');
            bgGrad.addColorStop(1, '#07090e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const centerX = width / 2;
            const centerY = height / 2;

            for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + Math.cos(angle) * width, centerY + Math.sin(angle) * height);
                ctx.stroke();
            }

            racks.forEach(rack => {
                const scale = 1 / rack.depth;
                const rackWidth = 140 * scale;
                const rackHeight = 280 * scale;
                
                let xPos, yPos;
                if (rack.side === 'left') {
                    xPos = centerX - (180 * scale) - rackWidth;
                } else {
                    xPos = centerX + (180 * scale);
                }
                yPos = centerY - (rackHeight / 2);

                if (rack.depth > 0.1 && xPos + rackWidth > 0 && xPos < width) {
                    ctx.fillStyle = '#05070a';
                    ctx.fillRect(xPos, yPos, rackWidth, rackHeight);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.strokeRect(xPos, yPos, rackWidth, rackHeight);

                    const rowH = (rackHeight - 20) / serverRows;
                    for (let j = 0; j < serverRows; j++) {
                        const sY = yPos + 10 + (j * rowH);
                        
                        ctx.fillStyle = '#10141d';
                        ctx.fillRect(xPos + 6, sY, rackWidth - 12, rowH - 4);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                        ctx.strokeRect(xPos + 6, sY, rackWidth - 12, rowH - 4);

                        if (Math.random() > 0.98) {
                            rack.lights[j] = !rack.lights[j];
                        }

                        const ledRadius = Math.max(1.5, 2.5 * scale);
                        const ledX = xPos + 16;
                        const ledY = sY + (rowH / 2) - 2;

                        ctx.beginPath();
                        ctx.arc(ledX, ledY, ledRadius, 0, Math.PI * 2);
                        if (rack.lights[j]) {
                            ctx.fillStyle = j % 3 === 0 ? '#ff2a5f' : '#0284c7';
                            ctx.shadowBlur = 10;
                            ctx.shadowColor = ctx.fillStyle;
                        } else {
                            ctx.fillStyle = '#1a2333';
                            ctx.shadowBlur = 0;
                        }
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        
                        // Pequeno detalhe simulando cablagem ou displays digitais
                        ctx.fillStyle = Math.random() > 0.5 ? '#0284c7' : '#0a324d';
                        ctx.fillRect(xPos + rackWidth - 25 * scale, sY + rowH/2 - 2, 15 * scale, 3 * scale);
                    }
                }

                rack.depth -= 0.0008;
                if (rack.depth < 0.15) {
                    rack.depth = 1.2;
                }
            });

            requestAnimationFrame(drawServerRoom);
        }

        drawServerRoom();
    </script>
</body>
</html>
