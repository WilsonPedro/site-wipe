<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mensagem enviada | Wire IT Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #1d1d1f;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 50px 30px;
      text-align: center;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
    }

    .logo {
      width: 260px;
      max-width: 90%;
      margin-bottom: 35px;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ff3464;
      color: #ffffff;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 32px;
      color: #1d1d1f;
    }

    p {
      margin: 0 auto 28px;
      max-width: 470px;
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 6px;
      background: #ff3464;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .button:hover {
      background: #d92350;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #888;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 27px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <img 
      src="logo.png" 
      alt="Wire IT Services, LDA"
      class="logo"
    >

    <div class="check">✓</div>

    <h1>Mensagem enviada!</h1>

    <p>
      Obrigado pelo seu contacto. A sua mensagem foi enviada com sucesso.
      Entraremos em contacto consigo assim que possível.
    </p>

    <a href="index.html" class="button">
      Voltar ao site
    </a>

    <div class="footer">
      © 2026 Wire IT Services, LDA. Todos os direitos reservados.
    </div>
  </main>

</body>
</html>
